runConfig:
  minInstances: 1
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
outputFiles:
  serverApp:
    include: [.]
env:
  # The Nitro server bundle step after prerender outgrew Node's default ~2 GB
  # heap and died with "JavaScript heap out of memory". Build-only: the
  # runtime instance has just 1 GiB.
  - variable: NODE_OPTIONS
    value: --max-old-space-size=4096
    availability:
      - BUILD
  - variable: HOST
    value: 0.0.0.0
    availability:
      - RUNTIME
  - variable: NITRO_HOST
    value: 0.0.0.0
    availability:
      - RUNTIME
  # Cloud Storage bucket for blog post images uploaded from /studio. Not a
  # secret — the bucket itself stays private, every read goes through
  # /media/blog/**.
  - variable: NUXT_FIREBASE_STORAGE_BUCKET
    value: xploit-games.firebasestorage.app
    availability:
      - RUNTIME

runtime: nodejs
